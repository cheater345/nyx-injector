name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build core + cli (tests included)
        run: gradle :core:build :cli:build :cli:installDist --stacktrace
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: nyx-injector-cli
          path: cli/build/install/nyx-injector/
      - uses: actions/upload-artifact@v4
        with:
          name: nyx-injector-apk
          path: app/build/outputs/apk/debug/app-debug.apk
